<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

<title>AR Camera</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
}

#player {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: black;
  display: none;
  z-index: 9999;
}

#mainVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
</style>

</head>

<body>

<div id="player">
  <video id="mainVideo" controls></video>
</div>

<a-scene
mindar-image="imageTargetSrc: targets.mind;"
color-space="sRGB"
renderer="colorManagement: true"
vr-mode-ui="enabled: false"
device-orientation-permission-ui="enabled: false">

<a-camera
position="0 0 0"
look-controls="enabled: false">
</a-camera>

<a-entity id="target0"  mindar-image-target="targetIndex: 0"></a-entity>
<a-entity id="target1"  mindar-image-target="targetIndex: 1"></a-entity>
<a-entity id="target2"  mindar-image-target="targetIndex: 2"></a-entity>
<a-entity id="target3"  mindar-image-target="targetIndex: 3"></a-entity>
<a-entity id="target4"  mindar-image-target="targetIndex: 4"></a-entity>
<a-entity id="target5"  mindar-image-target="targetIndex: 5"></a-entity>
<a-entity id="target6"  mindar-image-target="targetIndex: 6"></a-entity>
<a-entity id="target7"  mindar-image-target="targetIndex: 7"></a-entity>
<a-entity id="target8"  mindar-image-target="targetIndex: 8"></a-entity>
<a-entity id="target9"  mindar-image-target="targetIndex: 9"></a-entity>
<a-entity id="target10" mindar-image-target="targetIndex: 10"></a-entity>
<a-entity id="target11" mindar-image-target="targetIndex: 11"></a-entity>
<a-entity id="target12" mindar-image-target="targetIndex: 12"></a-entity>
<a-entity id="target13" mindar-image-target="targetIndex: 13"></a-entity>
<a-entity id="target14" mindar-image-target="targetIndex: 14"></a-entity>
<a-entity id="target15" mindar-image-target="targetIndex: 15"></a-entity>
<a-entity id="target16" mindar-image-target="targetIndex: 16"></a-entity>
<a-entity id="target17" mindar-image-target="targetIndex: 17"></a-entity>
<a-entity id="target18" mindar-image-target="targetIndex: 18"></a-entity>

</a-scene>

<script>
const player = document.querySelector("#player");
const video = document.querySelector("#mainVideo");

const videoMap = [
  "video1.mp4",
  "video2.mp4",
  "video3.mp4",
  "video4.mp4",
  "video5.mp4",
  "video6.mp4",
  "video7.mp4",
  "video8.mp4",
  "video9.mp4",
  "video10.mp4",
  "video11.mp4",
  "video12.mp4",
  "video13.mp4",
  "video14.mp4",
  "video15.mp4",
  "video16.mp4",
  "video17.mp4",
  "video18.mp4",
  "video19.mp4"
];

for (let i = 0; i < 19; i++) {

  const target = document.querySelector("#target" + i);

  target.addEventListener("targetFound", () => {

    video.pause();
    video.currentTime = 0;

    video.src = videoMap[i];

    player.style.display = "block";

    video.play();

  });

  target.addEventListener("targetLost", () => {

    video.pause();

    player.style.display = "none";

  });

}
</script>

</body>
</html>
